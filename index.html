<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Дрессировка">
<meta name="theme-color" content="#c8692b">
<title>Шакира: дрессировка</title>
<style>
/* ===================== СТИЛИ ===================== */
:root{
  --bg:#fbf3e8; --card:#fffaf3; --ink:#3b2416; --muted:#8a6a55;
  --accent:#c8692b; --accent2:#e9a05a; --choc:#5a3420; --cream:#f6e6d0;
  --good:#4f8a3c; --bad:#c0442c; --warn:#c98318;
  --fur:#d9843a; --furL:#eba15c; --furD:#b9672a;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(251,243,232,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #f0dfc8}
header h1{flex:1;margin:0;font-size:17px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;font-size:22px;color:var(--choc);cursor:pointer}
.hbtn:active{background:var(--cream)}
.hbtn.hide{visibility:hidden}
main{flex:1;padding:14px 14px 40px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 0 #f0dfc8,0 6px 18px rgba(90,52,32,.06)}
h2{margin:4px 0 6px;font-size:22px}
h3{margin:0 0 8px;font-size:17px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.passport{font-style:italic;color:var(--choc);font-size:14px}
.center{text-align:center}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;background:var(--cream);color:var(--choc);margin-bottom:10px;text-align:center;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 #9e4f1c}
.btn.primary:active{box-shadow:0 2px 0 #9e4f1c;transform:translateY(2px)}
.btn.big{padding:18px;font-size:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;border:2px solid var(--cream)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:16px 12px;text-align:center;border:0;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 1px 0 #f0dfc8,0 6px 18px rgba(90,52,32,.06)}
.tile .ic{font-size:28px;display:block;margin-bottom:4px}
.tile b{font-size:15px}
.tile:active{transform:scale(.97)}
.dogwrap{max-width:230px;margin:0 auto}
.hero{text-align:center}
/* шкалы */
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meter{font-size:12px;color:var(--muted);text-align:center}
.meter .bar{height:7px;border-radius:5px;background:#f0dfc8;overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;background:var(--accent2);transition:width .4s}
.meter.warn .bar i{background:var(--bad)}
.skillbar{height:10px;border-radius:6px;background:#f0dfc8;overflow:hidden;margin:6px 0 2px}
.skillbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s}
/* тренировка */
.stage{position:relative;background:linear-gradient(#fff6ea,#f7e3c8);border-radius:var(--r);padding:10px 10px 6px;margin-bottom:10px;overflow:hidden}
.stage .dogwrap{max-width:220px}
.status{background:#fff;border-radius:12px;padding:8px 12px;font-size:15px;text-align:center;min-height:40px;display:flex;align-items:center;justify-content:center}
.fb{position:absolute;top:10px;left:50%;transform:translate(-50%,-8px);padding:6px 12px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.fb.show{opacity:1;transform:translate(-50%,0)}
.fb.good{background:var(--good);color:#fff}.fb.bad{background:var(--bad);color:#fff}.fb.warn{background:var(--warn);color:#fff}
.treat{position:absolute;left:50%;bottom:80px;font-size:34px;opacity:0;pointer-events:none}
.treat.fly{animation:fly .8s ease-out}
@keyframes fly{0%{opacity:1;transform:translate(60px,40px) scale(.6)}60%{opacity:1;transform:translate(-10px,-30px) scale(1.1)}100%{opacity:0;transform:translate(-14px,-10px) scale(.4)}}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:2px 2px 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.actions .btn{flex:1 1 45%;margin:0;font-size:15px;padding:13px 8px}
.yesrow{display:flex;align-items:center;justify-content:center;gap:18px}
.yes{width:118px;height:118px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f0a35e,var(--accent));color:#fff;font-size:30px;font-weight:800;box-shadow:0 6px 0 #9e4f1c,0 10px 24px rgba(200,105,43,.35);cursor:pointer;font-family:inherit}
.yes:active{transform:translateY(4px);box-shadow:0 2px 0 #9e4f1c}
.pause{width:70px;height:70px;border-radius:50%;border:0;background:var(--cream);color:var(--choc);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.give{width:70px;height:70px;border-radius:50%;border:0;background:#fff;font-size:30px;cursor:pointer;box-shadow:0 3px 0 #e2c9a8}
.give{width:84px;height:84px;font-size:28px;line-height:1.1;font-family:inherit}
.give small{font-size:12px;font-weight:700;color:var(--choc)}
.give:active,.pause:active{transform:translateY(2px)}
.pulse{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(200,105,43,.0)}50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(200,105,43,.28)}}
.howlink{display:block;margin:12px auto 0;background:none;border:0;color:var(--accent);font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
/* разбор, списки */
.stars{font-size:34px;letter-spacing:4px}
.pct{font-size:48px;font-weight:800;color:var(--accent);line-height:1}
.mist{border-left:4px solid var(--bad);padding:8px 12px;background:#fff;border-radius:10px;margin:8px 0}
.mist.good{border-color:var(--good)}
.mist b{display:block}
.mist .think{color:var(--muted);font-size:14px;margin-top:4px}
ol,ul{padding-left:22px;margin:6px 0}
li{margin:5px 0}
.rule{background:var(--accent);color:#fff;border-radius:var(--r);padding:16px;font-size:18px;font-weight:600;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid #f3e4d0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.lvl{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px;cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit;color:var(--ink);box-shadow:0 1px 0 #f0dfc8}
.lvl .n{width:38px;height:38px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--choc);flex:none}
.lvl.done .n{background:var(--good);color:#fff}
.lvl.open .n{background:var(--accent);color:#fff}
.lvl.locked{opacity:.55}
.lvl .t{flex:1}
.lvl .t small{display:block;color:var(--muted);font-size:13px}
.lvl .s{font-size:14px;white-space:nowrap}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:2px solid var(--cream);background:#fff;margin-bottom:8px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.right{border-color:var(--good);background:#eef6ea}
.opt.wrong{border-color:var(--bad);background:#fbece8}
.opt[disabled]{cursor:default}
.diary-item{padding:10px 0;border-bottom:1px solid #f3e4d0;font-size:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--cream);font-size:12px;margin-right:4px}
/* модалка и подсказка */
#modal{position:fixed;inset:0;background:rgba(59,36,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
#modal.hidden{display:none}
#modal .card{width:100%;max-width:460px;max-height:86vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#hint{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--choc);color:#fff;padding:10px 14px;border-radius:14px;font-size:14px;z-index:30;max-width:90%;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#hint.show{opacity:1}

/* ===================== СОБАКА (SVG) ===================== */
.dog{width:100%;height:auto;display:block;overflow:visible}
.dog .fur{fill:var(--fur)} .dog .fur-l{fill:var(--furL)} .dog .fur-d{fill:var(--furD)}
.dog .muzzle{fill:#f3c58f} .dog .eye{fill:#2a170c} .dog .glint{fill:#fff} .dog .nose{fill:#3a2012}
.dog .smile{fill:none;stroke:#3a2012;stroke-width:2.5;stroke-linecap:round;transition:opacity .2s}
.dog .yawn{fill:#7a2a22;opacity:0;transition:opacity .2s} .dog .tongue{fill:#e66a7a;opacity:0;transition:opacity .2s}
.dog .stem{fill:none;stroke:var(--furD);stroke-width:9;stroke-linecap:round}
.dog .shadow{fill:rgba(90,52,32,.14)}
.dog .blush{fill:#f08a7a;opacity:.35}
.dog g,.dog ellipse{transform-box:view-box}
.dog g{transition:transform .35s ease,opacity .3s ease}
.dog .root{transform-origin:120px 222px}
.dog .upper{transform-origin:120px 200px}
.dog .head{transform-origin:120px 135px}
.dog .earL{transform-origin:86px 86px}
.dog .earR{transform-origin:154px 86px}
.dog .tailIn{transform-origin:150px 165px}
.dog .legs{transform-origin:120px 216px}
.dog .haunch,.dog .liepaws,.dog .hind{opacity:0}
.dog[data-pose=stand] .hind{opacity:1}
.dog[data-pose=stand] .upper{transform:translateY(-8px)}
.dog[data-pose=stand] .legs{transform:scaleY(1.18)}
.dog[data-pose=sit] .haunch{opacity:1}
.dog[data-pose=lie] .upper{transform:translateY(40px)}
.dog[data-pose=lie] .legs{opacity:0}
.dog[data-pose=lie] .liepaws{opacity:1}
.dog[data-pose=lie] .tail{transform:translateY(42px)}
.dog[data-head=away] .head{transform:rotate(-14deg) translateX(-6px)}
.dog[data-head=away] .pupils{transform:translateX(-5px)}
.dog[data-head=down] .head{transform:translateY(10px)}
.dog[data-head=down] .pupils{transform:translateY(3px)}
.dog[data-head=up] .head{transform:translateY(-4px)}
.dog[data-head=up] .pupils{transform:translateY(-3px)}
.dog[data-ears=perk] .earL{transform:rotate(18deg)}
.dog[data-ears=perk] .earR{transform:rotate(-18deg)}
.dog[data-ears=back] .earL{transform:rotate(-10deg) translateY(6px)}
.dog[data-ears=back] .earR{transform:rotate(10deg) translateY(6px)}
.dog[data-tail=wag] .tailIn{animation:wag .28s ease-in-out infinite alternate}
.dog[data-tail=down] .tailIn{transform:rotate(75deg)}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(22deg)}}
.dog[data-mouth=open] .tongue{opacity:1}
.dog[data-mouth=yawn] .yawn{opacity:1}
.dog[data-mouth=yawn] .smile{opacity:0}
.dog[data-mouth=lick] .tongue{opacity:1;animation:lick .45s ease-in-out infinite alternate}
@keyframes lick{from{transform:translateY(0)}to{transform:translateY(-13px)}}
.dog[data-anim=jump] .root{animation:jump .5s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.dog[data-anim=sniff] .head{animation:sniff .6s ease-in-out infinite alternate}
@keyframes sniff{from{transform:rotate(-14deg) translate(-6px,6px)}to{transform:rotate(-14deg) translate(-6px,11px)}}
.dog[data-anim=hide] .root{transform:scale(.85) translateY(12px)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="back" aria-label="Назад">‹</button>
    <h1 id="title">Дрессировка</h1>
    <button class="hbtn" id="snd" aria-label="Звук">🔊</button>
  </header>
  <main id="view"></main>
</div>
<div id="modal" class="hidden"><div class="card" id="modalBody"></div></div>
<div id="hint"></div>

<script>
/* ============================================================
   СЛОЙ 1. PET — данные питомца.
   Для «Лапок» сюда подставляется выбранный питомец: init(petConfig)
   ============================================================ */
const DEFAULT_PET = {
  id: 'shakira',
  name: 'Шакира', nameAcc: 'Шакиру', nameIns: 'Шакирой', nameGen: 'Шакиры', nameDat: 'Шакире',
  species: 'dog',            // 'dog' | 'cat' (контент для кошек — позже)
  breed: 'той-пудель',
  sex: 'f',                  // 'f' | 'm'
  birth: '2026-06-01',
  color: 'рыжий',
  passportName: 'Сердолика Тайная Хранительница'
};

/* ============================================================
   СЛОЙ 2. CONTENT — уровни, ошибки, ситуации, викторины, памятка.
   Подстановки: {name} {nameAcc} {nameGen} {nameDat} {ona} {Ona} {ee} {ey}
   {a} — окончание глагола прош. вр. (села/сел), {sya} — (отвернулась/отвернулся)
   ============================================================ */
const CONTENT = {
 dog: {
  rewards: [
    {id:'korm', icon:'🟤', name:'Сухой корм', value:1, note:'Дома без отвлечений его достаточно. Можно отдавать часть дневной нормы.'},
    {id:'syr',  icon:'🧀', name:'Кусочек сыра', value:3, note:'Очень ценно. Лучше беречь для улицы и сложных моментов.'},
    {id:'toy',  icon:'🎾', name:'Игрушка', value:2, note:'Игра длинная — хороша как финальная награда в конце сессии.'}
  ],
  levels: [
   { id:'marker', title:'Маркер «Да!»', short:'Звук, который обещает лакомство', mechanic:'marker', ready:true,
     lesson:{
       rule:'«Да!» = «Ты молодец, сейчас будет награда». После каждого «Да!» — лакомство. Всегда.',
       why:'Маркер — мост между моментом, когда {name} сделал{a} правильно, и наградой. Рука с лакомством за 1 секунду не успевает, а слово успевает. Но если «Да!» хоть иногда звучит без награды, оно обесценивается.',
       steps:['Говорите «Да!» коротко и всегда одинаково.','Сразу после «Да!» — лакомство (в течение 1–2 секунд).','Не говорите «Да!», когда {name} прыгает на вас — так вы наградите прыжки.','10–15 повторов за сессию — и маркер «заряжен».'],
       game:'Нажимайте «Да!» в спокойный момент и сразу — кнопку награды. Пока {name} прыгает — ждите.'
     },
     howto:['{name} то спокойно сидит или стоит, то прыгает на вас.','Когда {ona} ведёт себя спокойно — нажмите большую кнопку «Да!».','Сразу после этого нажмите кнопку награды справа (с лакомством). На это есть 2–3 секунды.','Пока {name} прыгает — ничего не нажимайте, ждите.','В первых повторах нужная кнопка будет мигать подсказкой.'],
     task:{
       title:'Зарядите маркер',
       steps:['Возьмите 15 кусочков корма размером с горошину.','В тихой комнате: «Да!» → сразу кусочек. Ничего не требуйте от {nameGen}.','10–15 повторов, сессия 2–3 минуты.','Проверка: когда {name} отвлечётся, скажите «Да!». Повернул{sya} к вам и ждёт? Маркер заряжен — и не забудьте дать кусочек.'],
       checklist:['Каждое «Да!» — с наградой','Не говорили «Да!» во время прыжков','Сессия не дольше 5 минут','Закончили, пока {name} ещё хотел{a} заниматься']
     },
     tipFail:'Если {name} не реагирует на «Да!» — возможно, {ona} сыт{a} или лакомство недостаточно ценное. Попробуйте перед кормлением и с кусочком повкуснее.'
   },
   { id:'name', title:'Имя и контакт глаз', short:'Имя = «посмотри на меня»', mechanic:'name', ready:true,
     lesson:{
       rule:'Имя говорим один раз. Посмотрел{a} в глаза — «Да!» и награда.',
       why:'Без внимания не работает ни одна команда. Если повторять имя много раз или звать, чтобы отругать, оно превращается в фоновый шум или неприятный сигнал.',
       steps:['Скажите имя один раз, обычным голосом.','Подождите взгляд 2–3 секунды.','Посмотрел{a} — сразу «Да!» и награда.','Не отозвал{sya} — НЕ повторяйте. Чмокните губами или отойдите на шаг, и наградите за взгляд.','Никогда не зовите по имени, чтобы ругать.'],
       game:'Нажмите «Позвать» один раз. Как только {name} посмотрит на вас — «Да!». Не успели или не посмотрел{a} — не зовите повторно.'
     },
     howto:['{name} нюхает пол и не смотрит на вас.','Нажмите «Позвать» — один раз.','Как только {ona} повернёт голову и посмотрит на вас — жмите «Да!». Награда даётся сама.','Не посмотрел{a}? Не зовите снова — дождитесь следующего повтора.','В первых повторах нужная кнопка будет мигать подсказкой.'],
     task:{
       title:'Имя дома',
       steps:['10 повторов за сессию, 2 сессии в день.','Начните, когда {name} рядом и ничем интересным не увлечён{a}.','Постепенно зовите при лёгком отвлечении — например, игрушка на полу.','Зовите и из другой комнаты — и награждайте за каждый отклик.'],
       checklist:['Имя — один раз, без повторов','«Да!» в течение 1–2 секунд после взгляда','Ни разу не позвали по имени, чтобы отругать','Сессия до 5 минут']
     },
     tipFail:'Уберите отвлечения, подойдите ближе, возьмите лакомство ценнее. Если {name} хочет спать — перенесите занятие.'
   },
   { id:'sit', title:'Сидеть', short:'Сначала рука, потом слово', mechanic:'sit', ready:true,
     lesson:{
       rule:'Сначала рука с лакомством, потом слово. «Сидеть» добавляем, когда {name} садится за рукой 8 раз из 10.',
       why:'Пока поведения нет, слову не к чему «прилипнуть». Если твердить «Сидеть, сидеть, СИДЕТЬ!» без результата, {name} выучит, что эти звуки ничего не значат.',
       steps:['Поднесите лакомство к носу.','Медленно ведите руку вверх и чуть назад, над головой. Голова идёт вверх — попа опускается.','Попа коснулась пола — «Да!» и награда.','Не давите руками на спину и попу — у той-пуделя хрупкие суставы.','Когда садится за рукой уверенно — говорите «Сидеть» один раз ПЕРЕД движением руки.'],
       game:'Используйте «Приманку». Кнопка «Сидеть» заработает, когда навык дойдёт до 50%. Отмечайте «Да!» в момент посадки.'
     },
     howto:['{name} стоит перед вами.','Нажмите «Приманка» — вы ведёте лакомство от носа вверх-назад.','Как только {name} сядет — сразу жмите «Да!». Награда даётся сама.','Кнопка «Сидеть» заработает, когда навык дойдёт до 50%.','В первых повторах нужная кнопка будет мигать подсказкой.'],

function ageText(){
  const b = new Date(PET.birth), n = new Date();
  let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if (n.getDate() < b.getDate()) m--;
  if (m < 1) return 'меньше месяца';
  if (m < 12) return m + ' мес.';
  const y = Math.floor(m/12), r = m%12;
  return y + ' г.' + (r ? ' ' + r + ' мес.' : '');
}

/* --- звук (Web Audio) --- */
function audioInit(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type='sine', g=.15, f2){
  if (!D.sound || !AC) return;
  const o = AC.createOscillator(), v = AC.createGain(), t0 = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+d);
  v.gain.setValueAtTime(g, t0); v.gain.exponentialRampToValueAtTime(.001, t0+d);
  o.connect(v).connect(AC.destination); o.start(t0); o.stop(t0+d+.02);
}
function bark(){
  if (!D.sound || !AC) return;
  const t0 = AC.currentTime;
  [0, .2].forEach(dt => {
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), v = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(950, t0+dt); o.frequency.exponentialRampToValueAtTime(420, t0+dt+.11);
    f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = 1.4;
    v.gain.setValueAtTime(.0001, t0+dt); v.gain.exponentialRampToValueAtTime(.4, t0+dt+.012);
    v.gain.exponentialRampToValueAtTime(.001, t0+dt+.14);
    o.connect(f).connect(v).connect(AC.destination); o.start(t0+dt); o.stop(t0+dt+.16);
  });
}
function sfx(k){
  audioInit();
  if (k==='click') tone(1900, .05, 'square', .07);
  if (k==='ok'){ tone(660, .12, 'sine', .12); setTimeout(()=>tone(990, .18, 'sine', .12), 110); }
  if (k==='bad') tone(240, .2, 'triangle', .1);
  if (k==='bark') bark();
}

/* --- прогресс уровней --- */
const levels = () => C.levels;
const skillOf = id => D.skills[id] || 0;
function isUnlocked(i){ return i === 0 || !!D.done[levels()[i-1].id]; }
function currentLevelIndex(){
  const L = levels();
  for (let i=0;i<L.length;i++){ if (L[i].ready && isUnlocked(i) && !D.done[L[i].id]) return i; }
  let last = 0; L.forEach((l,i)=>{ if (l.ready && isUnlocked(i)) last = i; });
  return last;
}
function starsText(n){ return '★'.repeat(n) + '☆'.repeat(3-n); }

/* ============================================================
   ТРЕНИРОВКА
   ============================================================ */
function meterHTML(){
  return `<div class="meters card" style="padding:12px">
    <div class="meter" id="m-att">👀 Внимание<div class="bar"><i></i></div></div>
    <div class="meter" id="m-exc">⚡ Возбужд.<div class="bar"><i></i></div></div>
    <div class="meter" id="m-tru">🤝 Доверие<div class="bar"><i></i></div></div>
    <div class="meter" id="m-mot">🍖 Мотивация<div class="bar"><i></i></div></div>
  </div>`;
}
function updateMeters(){
  if (!S) return;
  const set = (id, v, warn) => { const m = $(id); if (!m) return; m.querySelector('i').style.width = clamp(v)+'%'; m.classList.toggle('warn', !!warn); };
  set('#m-att', S.att, S.att < 35); set('#m-exc', S.exc, S.exc > 60);
  set('#m-tru', D.trust, D.trust < 40); set('#m-mot', S.mot, S.mot < 35);
}
function updateProgress(){
  const p = $('#prog'); if (!p || !S) return;
  p.innerHTML = `<span>Повтор ${Math.min(S.trials+1, S.target)} из ${S.target}</span><span>✓ ${S.success} · навык ${skillOf(S.L.id)}%</span>`;
}
function status(text){ const s = $('#status'); if (s) s.textContent = t(text); }
let fbT;
function fb(text, kind){
  const f = $('#fb'); if (!f) return;
  f.textContent = text; f.className = 'fb show ' + kind;
  clearTimeout(fbT); fbT = setTimeout(()=>{ f.className = 'fb ' + kind; }, 1300);
  if (kind === 'bad') sfx('bad');
}
function giveTreat(){
  const tr = $('#treat'); if (!tr) return;
  tr.textContent = S.R.icon; tr.classList.remove('fly'); void tr.offsetWidth; tr.classList.add('fly');
}

function startTraining(i, rid){
  const L = levels()[i], R = C.rewards.find(r=>r.id===rid);
  S = { kind:'train', L, idx:i, R, target:10, trials:0, success:0, mistakes:{}, att:90, exc:25,
        mot: 40 + R.value*15, dev:0, stress:false, phase:'idle', timers:[], dead:false, flags:{},
        situShown:false, situ:null, pauses:0, goodPause:0, extra:false,
        guideN: (D.stars[L.id]||0) >= 2 ? 0 : 3 };
  go('train');
}
function renderTrain(){
  if (!S) return go('home');
  S.dead = false; S.timers = [];
  header(t(S.L.title), 'map');
  const m = S.L.mechanic;
  let acts = '';
  if (m === 'name') acts = `<button class="btn" id="callBtn" onclick="App.act('call')">📣 Позвать «${PET.name}!»</button>`;
  if (m === 'sit')  acts = `<button class="btn" id="lureBtn" onclick="App.act('lure')">🤚 Приманка вверх-назад</button><button class="btn" id="wordBtn" onclick="App.act('word')">🗣️ «Сидеть»</button>`;
  view().innerHTML = `
   ${meterHTML()}
   <div class="prog" id="prog"></div>
   <div class="stage" id="stage">
     <div class="fb" id="fb"></div>
     <div class="treat" id="treat"></div>
     <div class="dogwrap">${dogSVG()}</div>
     <div class="status" id="status"></div>
   </div>
   ${acts ? `<div class="actions">${acts}</div>` : ''}
   <div class="yesrow">
     <button class="pause" onclick="App.act('pause')">⏸<br>Пауза</button>
     <button class="yes" id="yesBtn" onclick="App.act('yes')">Да!</button>
     ${m==='marker' ? `<button class="give" id="giveBtn" onclick="App.act('give')">${S.R.icon}<br><small>Дать</small></button>` : `<span style="width:70px"></span>`}
   </div>
   <button class="howlink" onclick="App.howto(false)">❓ Как играть</button>`;
  updateMeters(); updateProgress();
  if (!D.howto[S.L.id]) { S.phase = 'situ'; App.howto(true); return; }
  nextTrial(true);
}

function guiding(){ return S && S.trials < S.guideN; }
function cue(id, on){ const b = document.getElementById(id); if (b) b.classList.toggle('pulse', !!on); }
function cueOff(){ ['yesBtn','giveBtn','callBtn','lureBtn'].forEach(id=>cue(id,false)); }
function prob(){
  const sk = skillOf(S.L.id);
  let p = .62 + sk/100*.35;
  p *= Math.sqrt(S.att/100);
  p *= 1 - Math.max(0, S.exc-50)/90;
  p *= .75 + D.trust/400;
  p *= .7 + S.mot/170;
  p *= 1 - S.dev/160;
  return clamp(p, .06, .95);
}
function addSkill(d){
  const id = S.L.id, v = skillOf(id);
  if (d > 0 && v >= 70) d = Math.ceil(d/2);
  D.skills[id] = clamp(v + d); save();
  if (S.L.mechanic === 'sit' && v < 50 && D.skills[id] >= 50) hint('Навык 50% — теперь можно говорить «Сидеть» перед жестом');
}
function addMistake(k){
  S.mistakes[k] = (S.mistakes[k]||0) + 1;
  if (k==='late' || k==='repeat' || k==='jumpReward' || k==='noreward') addSkill(-2);
}

function idleSetup(){
  const m = S.L.mechanic;
  S.phase = 'idle'; S.flags = {}; cueOff();
  if (m === 'marker'){ markerCycle(); }
  if (m === 'name'){ setDog({...DOG_RESET, head:'away', anim:'sniff'}); status(guiding() ? '{name} нюхает пол. Нажмите «Позвать»' : '{name} что-то нюхает на полу'); if (guiding()) cue('callBtn', true); }
  if (m === 'sit'){ setDog({...DOG_RESET, pose:'stand'}); status(guiding() ? '{name} стоит. Нажмите «Приманка»' : '{name} стоит и смотрит на вас'); if (guiding()) cue('lureBtn', true); }
}
function nextTrial(first){
  if (!S || S.dead) return;
  if (S.trials >= S.target) return finishSession();
  if (!S.situShown && S.trials === 5 && !S.extra) { S.situShown = true; return showSituation(); }
  updateMeters(); updateProgress();
  if (!first && (S.exc > 60 || S.att < 35) && Math.random() < .5) S.stress = true;
  if (S.stress){
    S.phase = 'stress'; S.stressHits = 0;
    setDog({...DOG_RESET, head:'away', mouth:'yawn'});
    status('{name} зевает и облизывает нос…');
    later(()=>{ if (S.stress) setDog({mouth:'lick'}); }, 1300);
    return;
  }
  idleSetup();
}
function endTrial(ok, msg){
  if (S.phase === 'end') return;
  S.phase = 'end'; S.trials++; S.att = clamp(S.att - 3); cueOff();
  if (ok){
    S.success++; addSkill(S.viaWord ? 8 : 6); S.exc = clamp(S.exc + 2);
    sfx('ok'); fb('✓ ' + msg, 'good'); setDog({tail:'wag', mouth:'open', anim:'none'});
  } else fb(msg, 'bad');
  S.viaWord = false;
  updateMeters(); updateProgress();
  later(()=>nextTrial(), 1300);
}
function doPause(){
  S.locked = true; S.pauses++;
  if (S.stress){ S.stress = false; S.goodPause++; fb('Верно: пауза!', 'good'); }
  S.exc = clamp(S.exc - 25); S.att = clamp(S.att + 12);
  setDog({...DOG_RESET, pose:'lie', tail:'wag'});
  status('Пауза: спокойно гладим, дышим…');
  updateMeters();
  later(()=>{ S.locked = false; idleSetup(); }, 1800);
}

/* --- механики уровней --- */
function markerCycle(){
  if (!S || S.phase !== 'idle') return;
  const jump = Math.random() < .2 + S.exc/400;
  if (jump){
    S.dogState = 'jump';
    setDog({...DOG_RESET, pose:'stand', anim:'jump', tail:'wag', ears:'perk', mouth:'open'});
    status(guiding() ? '{name} прыгает — ничего не нажимайте, ждите' : '{name} прыгает на вас!');
    cue('yesBtn', false);
  } else {
    S.dogState = 'calm';
    const pose = Math.random() < .5 ? 'sit' : 'stand';
    setDog({...DOG_RESET, pose, head: Math.random()<.6?'look':'away', ears: skillOf('marker')>40?'perk':'normal'});
    status(guiding() ? 'Спокойный момент — жмите «Да!»' : (pose === 'sit' ? '{name} спокойно сидит рядом' : '{name} спокойно стоит рядом'));
    if (guiding()) cue('yesBtn', true);
  }
  later(markerCycle, rnd(1800, 2800));
}
const Mech = {
  marker(a){
    if (a === 'yes'){
      sfx('click');
      if (S.phase === 'await'){ addMistake('noreward'); return endTrial(false, 'Второе «Да!» без награды'); }
      if (S.phase !== 'idle') return;
      if (S.dogState === 'jump'){ addMistake('jumpReward'); S.exc = clamp(S.exc + 6); return endTrial(false, 'Наградили прыжки'); }
      S.phase = 'await';
      setDog({ears:'perk', head:'look', anim:'none'});
      cue('yesBtn', false); cue('giveBtn', true);
      status('Теперь сразу нажмите «Дать» →');
      later(()=>{ if (S.phase === 'await'){ addMistake('noreward'); endTrial(false, 'Не дали награду после «Да!»'); } }, 2500);
    }
    if (a === 'give'){
      if (S.phase === 'await'){ giveTreat(); endTrial(true, '«Да!» + награда'); }
      else if (S.phase === 'idle') fb('Сначала «Да!», потом награда', 'warn');
    }
  },
  name(a){
    if (a === 'call'){
      if (S.phase === 'called'){ addMistake('repeat'); S.dev = clamp(S.dev + 12); S.exc = clamp(S.exc + 6); fb('Повтор имени', 'bad'); updateMeters(); return; }
      if (S.phase === 'look' || S.phase === 'late'){ fb('Уже смотрит — жмите «Да!»', 'warn'); return; }
      if (S.phase !== 'idle') return;
      S.phase = 'called'; status('Вы: «{name}!»'); cue('callBtn', false);
      const p = prob();
      later(()=>{
        if (S.phase !== 'called') return;
        if (Math.random() < p){
          S.phase = 'look'; setDog({head:'look', ears:'perk', anim:'none', tail:'wag'});
          status(guiding() ? '{name} смотрит на вас — жмите «Да!»' : '{name} смотрит вам в глаза!');
          cue('callBtn', false); if (guiding()) cue('yesBtn', true);
          later(()=>{
            if (S.phase !== 'look') return;
            S.phase = 'late'; cue('yesBtn', false); setDog({head:'away', ears:'normal', tail:'still'});
            status('{Ona} снова отвернул{sya}');
            later(()=>{ if (S.phase === 'late'){ addMistake('missed'); endTrial(false, 'Упустили момент'); } }, 900);
          }, 1500);
        } else {
          later(()=>{ if (S.phase === 'called'){ endTrial(false, t('Не отозвал{sya}. Не повторяйте!')); status('Подсказка: чмокните губами или отойдите на шаг'); } }, 1800);
        }
      }, rnd(400, 900));
    }
    if (a === 'yes'){
      sfx('click');
      if (S.phase === 'look'){ giveTreat(); endTrial(true, 'Точно в момент!'); }
      else if (S.phase === 'late'){ addMistake('late'); endTrial(false, 'Поздно'); }
      else if (S.phase === 'idle' || S.phase === 'called'){ addMistake('early'); fb(t('Рано: {ona} ещё не посмотрел{a}'), 'bad'); }
    }
  },
  sit(a){
    if (a === 'lure' || a === 'word'){
      if (['luring','sit','late'].includes(S.phase)){
        if (a === 'word'){ addMistake('repeat'); S.dev = clamp(S.dev + 10); fb('Повтор команды', 'bad'); }
        return;
      }
      if (S.phase !== 'idle') return;
      if (a === 'word' && skillOf('sit') < 50){
        if (S.flags.word){ addMistake('repeat'); S.dev = clamp(S.dev + 10); S.exc = clamp(S.exc + 5); fb('Повтор: слово пока пустое', 'bad'); updateMeters(); return; }
        S.flags.word = true;
        status('Слово «Сидеть» пока ничего не значит для {nameGen}. Сначала — приманка');
        return;
      }
      S.phase = 'luring'; S.viaWord = (a === 'word');
      status(a === 'lure' ? 'Ведёте лакомство от носа вверх-назад…' : 'Вы: «Сидеть»');
      setDog({head:'up', ears:'perk'}); cue('lureBtn', false);
      let p = prob(); if (S.viaWord) p *= .85;
      later(()=>{
        if (S.phase !== 'luring') return;
        if (Math.random() < p){
          S.phase = 'sit'; setDog({pose:'sit', head:'look', tail:'wag'});
          status(guiding() ? '{name} сел{a} — жмите «Да!»' : '{name} сел{a}!');
          if (guiding()) cue('yesBtn', true);
          later(()=>{
            if (S.phase !== 'sit') return;
            S.phase = 'late'; cue('yesBtn', false); setDog({pose:'stand', tail:'still'});
            status('{Ona} уже встал{a}');
            later(()=>{ if (S.phase === 'late'){ addMistake('missed'); endTrial(false, 'Упустили момент'); } }, 900);
          }, 1500);
        } else {
          setDog({anim:'jump', pose:'stand'});
          status(S.viaWord ? '{name} не понял{a} без руки — помогите приманкой' : '{name} подпрыгнул{a} за рукой — держите лакомство у самого носа');
          later(()=>endTrial(false, S.viaWord ? 'Не сработало без жеста' : 'Рука слишком высоко'), 1100);
        }
      }, rnd(500, 1100));
    }
    if (a === 'yes'){
      sfx('click');
      if (S.phase === 'sit'){ giveTreat(); endTrial(true, S.viaWord ? 'По слову — отлично!' : 'Точно!'); }
      else if (S.phase === 'late'){ addMistake('late'); endTrial(false, t('Поздно: {ona} уже встал{a}')); }
      else if (S.phase === 'idle' || S.phase === 'luring'){ addMistake('early'); fb(t('Рано: {ona} ещё не сел{a}'), 'bad'); }
    }
  }
};

function showSituation(){
  const sit = C.situations[Math.floor(Math.random()*C.situations.length)];
  S.situQ = sit;
  S.phase = 'situ';
  setDog({...DOG_RESET, pose:'stand', head:'look'});
  status('Ситуация!');
  openModal(`<h3>🐾 Ситуация</h3><p style="font-size:17px">${t(sit.q)}</p><p class="muted">Что сделаете?</p>
    ${sit.opts.map((o,k)=>`<button class="opt" onclick="App.situ(${k})">${t(o.t)}</button>`).join('')}`);
}

function finishSession(){
  if (S.long) addMistake('long');
  const pct = Math.round(S.success / S.trials * 100);
  const stars = pct >= 80 ? 3 : pct >= 60 ? 2 : pct >= 40 ? 1 : 0;
  S.pct = pct; S.stars = stars;
  D.stars[S.L.id] = Math.max(D.stars[S.L.id]||0, stars);
  save();
  go('review');
}
function renderReview(){
  if (!S) return go('home');
  header('Разбор', 'map');
  const M = C.mistakes;
  const keys = Object.keys(S.mistakes).filter(k=>k!=='situation');
  const sk = skillOf(S.L.id);
  let verdict = S.pct >= 80 ? 'Отлично! В игре навык уверенный.' : S.pct >= 60 ? 'Хорошо. Ещё пара тренировок — и будет уверенно.' : S.pct >= 40 ? 'Неплохо для начала. Обратите внимание на ошибки ниже.' : 'Пока сложно. Перечитайте урок и попробуйте ещё раз.';
  view().innerHTML = `
   <div class="card center">
     <div class="pct">${S.pct}%</div>
     <div class="stars">${starsText(S.stars)}</div>
     <p>${verdict}</p>
     <p class="muted">Навык «${t(S.L.title)}» в игре: ${sk}%${sk>=80?' — можно усложнять':''}</p>
   </div>
   ${S.goodPause ? `<div class="mist good"><b>✓ Заметили стресс и сделали паузу${S.goodPause>1?' ×'+S.goodPause:''}</b><div class="think">Так и надо: короткая пауза сохраняет желание заниматься.</div></div>` : ''}
   ${S.situ ? `<div class="mist ${S.situ.ok?'good':''}"><b>${S.situ.ok?'✓':'✗'} Ситуация: ${t(S.situQ.q)}</b><div class="think">${t(S.situ.e)}</div></div>` : ''}
   ${keys.length ? `<h3 style="margin:14px 4px 4px">Ошибки</h3>` : `<div class="mist good"><b>✓ Без ошибок в тайминге</b></div>`}
   ${keys.map(k=>`<div class="mist"><b>${M[k].title}${S.mistakes[k]>1?' ×'+S.mistakes[k]:''}</b>${t(M[k].text)}<div class="think">Что подумал${PET.sex==='f'?'а':''} ${PET.name}: ${t(M[k].think)}</div></div>`).join('')}
   <div style="margin-top:14px">
     ${S.stars >= 1 ? `<button class="btn primary big" onclick="go('task', {i:${S.idx}, pct:${S.pct}})">📋 К заданию на сегодня</button>` : ''}
     <button class="btn" onclick="go('prep', ${S.idx})">🔁 Повторить тренировку</button>
     ${!S.extra ? `<button class="btn ghost" onclick="App.extra()">Ещё 5 повторов</button>` : ''}
   </div>`;
}

/* ============================================================
   МИНИ-ИГРЫ
   ============================================================ */
function startMoment(){
  header('Поймай момент', 'games');
  S = {kind:'moment', timers:[], dead:false, round:0, hits:0, early:0, miss:0, times:[], phase:'wait'};
  view().innerHTML = `
   <p class="muted center">${PET.name} то стоит, то садится. Жмите «Да!» сразу, как только ${PET.sex==='f'?'она':'он'} сядет. Цель — быстрее 1 секунды.</p>
   <div class="prog" id="prog"></div>
   <div class="stage" id="stage"><div class="fb" id="fb"></div><div class="dogwrap">${dogSVG()}</div><div class="status" id="status">Приготовьтесь…</div></div>
   <div class="yesrow"><button class="yes" onclick="App.momentTap()">Да!</button></div>`;
  later(momentRound, 900);
}
function momentRound(){
  if (S.round >= 12) return momentEnd();
  S.round++; S.phase = 'wait';
  $('#prog').innerHTML = `<span>Раунд ${S.round} из 12</span><span>✓ ${S.hits}</span>`;
  setDog({...DOG_RESET, pose:'stand'}); status('Ждём…');
  later(()=>{
    if (S.phase !== 'wait') return;
    S.phase = 'sit'; S.t0 = performance.now(); setDog({pose:'sit', tail:'wag'}); status(t('Сел{a}!'));
    later(()=>{ if (S.phase === 'sit'){ S.miss++; S.phase = 'done'; fb('Пропустили', 'bad'); later(momentRound, 700); } }, 1100);
  }, rnd(900, 2700));
}
function momentEnd(){
  const avg = S.times.length ? Math.round(S.times.reduce((a,b)=>a+b,0)/S.times.length) : null;
  if (avg && S.hits >= 8 && (!D.moment || avg < D.moment)){ D.moment = avg; save(); }
  const g = avg == null ? 'Попробуйте ещё раз.' : avg < 600 ? 'Супер! Такой тайминг — как у профессионала.' : avg < 1000 ? 'Хорошо: укладываетесь в окно маркера.' : 'Медленно: собака уже может делать что-то другое.';
  view().innerHTML = `<div class="card center"><h2>Результат</h2>
    <div class="pct">${avg!=null?avg+' мс':'—'}</div><p>${g}</p>
    <p class="muted">Попаданий: ${S.hits} · рано: ${S.early} · пропущено: ${S.miss}</p></div>
    <button class="btn primary" onclick="go('moment')">Ещё раз</button><button class="btn" onclick="go('games')">К мини-играм</button>`;
}
function startFeel(){
  header('Что чувствует ' + PET.name + '?', 'games');
  S = {kind:'feel', timers:[], dead:false, i:0, score:0, items: shuffle(C.feelings)};
  feelQ();
}
function feelQ(){
  if (S.i >= S.items.length) return quizEnd(S.score, S.items.length, 'feel');
  const q = S.items[S.i];
  view().innerHTML = `<div class="prog"><span>Вопрос ${S.i+1} из ${S.items.length}</span><span>✓ ${S.score}</span></div>
   <div class="stage" id="stage"><div class="dogwrap">${dogSVG()}</div></div>
   <p style="font-weight:600">Что ${PET.sex==='f'?'она':'он'} сейчас чувствует?</p>
   ${C.feelOpts.map(o=>`<button class="opt" data-id="${o.id}" onclick="App.feelAns('${o.id}')">${o.t}</button>`).join('')}
   <div id="expl"></div>`;
  setDog(q.dog);
}
function startRQuiz(){
  header('Выбери награду', 'games');
  S = {kind:'rquiz', timers:[], dead:false, i:0, score:0, items: shuffle(C.rewardQuiz)};
  rQ();
}
function rQ(){
  if (S.i >= S.items.length) return quizEnd(S.score, S.items.length, 'rquiz');
  const q = S.items[S.i];
  const label = id => id === 'later' ? '⏳ Перенести занятие' : (r => r.icon + ' ' + r.name)(C.rewards.find(r=>r.id===id));
  view().innerHTML = `<div class="prog"><span>Ситуация ${S.i+1} из ${S.items.length}</span><span>✓ ${S.score}</span></div>
   <div class="card"><p style="font-size:17px;margin:0">${t(q.q)}</p></div>
   ${q.opts.map(id=>`<button class="opt" data-id="${id}" onclick="App.rAns('${id}')">${label(id)}</button>`).join('')}
   <div id="expl"></div>`;
}
function markAnswer(chosen, right, expl, nextFn){
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    if (b.dataset.id === right) b.classList.add('right');
    else if (b.dataset.id === chosen) b.classList.add('wrong');
  });
  const ok = chosen === right; if (ok){ S.score++; sfx('ok'); } else sfx('bad');
  $('#expl').innerHTML = `<div class="mist ${ok?'good':''}"><b>${ok?'Верно!':'Не совсем.'}</b>${t(expl)}</div><button class="btn primary" onclick="App.${nextFn}()">Дальше</button>`;
}
function quizEnd(score, total, again){
  view().innerHTML = `<div class="card center"><h2>Готово!</h2><div class="pct">${score} / ${total}</div>
   <p>${score===total?'Идеально!':score>=total*0.6?'Хороший результат.':'Стоит пройти ещё раз.'}</p></div>
   <button class="btn primary" onclick="go('${again}')">Ещё раз</button><button class="btn" onclick="go('games')">К мини-играм</button>`;
}

/* ============================================================
   ДЕЙСТВИЯ (вызываются из кнопок)
   ============================================================ */
const App = {
  lesson(i){ go('lesson', i); },
  openLevel(i){
    const l = levels()[i];
    if (!l.ready) return hint('Этот уровень в разработке');
    if (!isUnlocked(i)) return hint('Сначала пройдите предыдущий уровень и отметьте «Сделали в жизни»');
    go('lesson', i);
  },
  start(i, rid){ audioInit(); startTraining(i, rid); },
  howto(first){
    if (!S || S.kind !== 'train') return;
    const h = S.L.howto || [];
    if (!first){ S.phase === 'situ' || (S.prevPhase = S.phase); }
    openModal(`<h3>🎮 Как играть</h3><ol>${h.map(x=>`<li>${t(x)}</li>`).join('')}</ol>
      <button class="btn primary" onclick="App.howtoDone(${first})">${first ? 'Понятно, начать' : 'Понятно'}</button>`);
  },
  howtoDone(first){
    closeModal();
    if (first){ D.howto[S.L.id] = true; save(); S.phase = 'idle'; nextTrial(true); }
  },
  act(a){
    if (!S || S.dead || S.kind !== 'train' || S.locked || S.phase === 'situ') return;
    audioInit();
    if (a === 'pause') return doPause();
    if (S.stress){
      addMistake('stress'); D.trust = clamp(D.trust - 3); S.exc = clamp(S.exc + 8); save();
      fb('Сначала пауза — она устала', 'bad'); updateMeters();
      S.stressHits = (S.stressHits||0) + 1;
      if (S.stressHits >= 2) status('Подсказка: нажмите «Пауза»');
      return;
    }
    Mech[S.L.mechanic](a);
  },
  situ(k){
    const o = S.situQ.opts[k];
    S.situ = o; D.trust = clamp(D.trust + o.trust); save();
    if (!o.ok) S.mistakes.situation = 1;
    o.ok ? sfx('ok') : sfx('bad');
    openModal(`<h3>${o.ok?'✓ Верно':'✗ Не лучший вариант'}</h3><p>${t(o.e)}</p>
      ${o.trust ? `<p class="muted">Доверие ${o.trust>0?'+':''}${o.trust}</p>` : ''}
      <button class="btn primary" onclick="App.situDone()">Продолжить тренировку</button>`);
  },
  situDone(){ closeModal(); updateMeters(); idleSetup(); updateProgress(); },
  extra(){
    S.extra = true; S.long = true; S.target += 5; S.att = clamp(S.att - 30); S.exc = clamp(S.exc + 10);
    stopAll(); S.dead = false; Screens.train();
  },
  chk(){
    const all = [...document.querySelectorAll('.check input')].every(c=>c.checked);
    $('#didBtn').disabled = !all;
  },
  did(i, pct){
    openModal(`<h3>Как прошло?</h3>
      <button class="opt" onclick="App.rate(${i}, ${pct}, 'easy')">😊 Легко</button>
      <button class="opt" onclick="App.rate(${i}, ${pct}, 'ok')">🙂 Нормально</button>
      <button class="opt" onclick="App.rate(${i}, ${pct}, 'fail')">😕 Не получилось</button>`);
  },
  rate(i, pct, r){
    const l = levels()[i];
    D.diary.push({date: new Date().toISOString(), level: l.id, title: t(l.title), rating: r, pct});
    const wasDone = !!D.done[l.id];
    if (r !== 'fail') D.done[l.id] = true;
    save();
    if (r === 'fail'){
      openModal(`<h3>Ничего страшного</h3><p>${t(l.tipFail)}</p><p class="muted">Повторите тренировку и попробуйте завтра ещё раз.</p>
        <button class="btn primary" onclick="go('lesson', ${i})">К уроку</button>`);
      return;
    }
    sfx('bark');
    const next = levels()[i+1];
    const nextTxt = !wasDone && next ? (next.ready ? `Открыт уровень ${i+2}: «${t(next.title)}».` : `Следующий уровень «${t(next.title)}» скоро появится.`) : '';
    openModal(`<h3>🎉 Молодцы!</h3><p>Занятие записано в дневник. ${nextTxt}</p>
      <p class="muted">Повторяйте это упражнение 2–3 раза в день несколько дней подряд.</p>
      <button class="btn primary" onclick="go('${next && next.ready && !wasDone ? 'map' : 'home'}')">${next && next.ready && !wasDone ? 'К уровням' : 'На главную'}</button>`);
  },
  feelAns(id){ const q = S.items[S.i]; markAnswer(id, q.a, q.e, 'feelNext'); },
  feelNext(){ S.i++; feelQ(); },
  rAns(id){ const q = S.items[S.i]; markAnswer(id, q.a, q.e, 'rNext'); },
  rNext(){ S.i++; rQ(); },
  momentTap(){
    if (!S || S.kind !== 'moment') return;
    sfx('click');
    if (S.phase === 'sit'){
      const dt = performance.now() - S.t0; S.times.push(dt); S.hits++; S.phase = 'done';
      fb((dt < 600 ? 'Идеально! ' : 'Хорошо: ') + Math.round(dt) + ' мс', 'good');
      later(momentRound, 700);
    } else if (S.phase === 'wait'){ S.early++; fb('Рано!', 'bad'); }
  },
  pet(){ audioInit(); sfx('bark'); const el = $('#homeDog .dog'); setDog({anim:'jump', mouth:'open'}, el); setTimeout(()=>setDog({anim:'none'}, el), 900); },
  toggleSound(){ D.sound = !D.sound; save(); $('#snd').textContent = D.sound ? '🔊' : '🔇'; },
  askReset(){
    openModal(`<h3>Сбросить прогресс?</h3><p>Уровни, звёзды, навыки и дневник будут удалены. Это нельзя отменить.</p>
      <button class="btn primary" style="background:var(--bad);box-shadow:none" onclick="App.reset()">Да, сбросить</button>
      <button class="btn" onclick="closeModal()">Отмена</button>`);
  },
  reset(){ D = freshData(); save(); closeModal(); go('home'); hint('Прогресс сброшен'); }
};

function freshData(){ return {skills:{}, stars:{}, done:{}, diary:[], trust:70, sound:true, moment:null, howto:{}}; }

/* ============================================================
   ЗАПУСК. Для «Лапок»: init({...питомец})
   ============================================================ */
function init(petConfig){
  PET = Object.assign({}, DEFAULT_PET, petConfig || {});
  if (!PET.nameAcc) PET.nameAcc = PET.name;
  if (!PET.nameGen) PET.nameGen = PET.name;
  if (!PET.nameDat) PET.nameDat = PET.name;
  if (!PET.nameIns) PET.nameIns = PET.name;
  C = CONTENT[PET.species] || CONTENT.dog;
  D = Object.assign(freshData(), store.load() || {});
  document.title = PET.name + ': дрессировка';
  $('#back').onclick = () => go(backTo || 'home');
  $('#snd').onclick = () => { audioInit(); App.toggleSound(); };
  $('#modal').onclick = e => { if (e.target.id === 'modal' && !(S && S.phase === 'situ')) closeModal(); };
  go('home');
}
init(DEFAULT_PET);
</script>
</body>
</html>
